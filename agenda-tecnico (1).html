<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda do técnico – protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5F6;--surface:#fff;--ink:#0F2A30;--muted:#5A7278;--line:#D3E2E5;--brand:#0B6E7F;--brand-ink:#fff;--soft:#DDEFF2;--taken:#E3EAEC;--ok:#1E8E5A;--warn:#B45F06;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A1E;--surface:#13262B;--ink:#E6F1F3;--muted:#93AAB0;--line:#234048;--brand:#3FB5C8;--brand-ink:#04252B;--soft:#17353C;--taken:#1B2F35;--ok:#4CC38A;--warn:#F2B45C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1A1E;--surface:#13262B;--ink:#E6F1F3;--muted:#93AAB0;--line:#234048;--brand:#3FB5C8;--brand-ink:#04252B;--soft:#17353C;--taken:#1B2F35;--ok:#4CC38A;--warn:#F2B45C;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:12px 16px 90px}
h1{font-size:20px;margin:0}h2{font-size:22px;margin:18px 0 4px;line-height:1.2}
p{margin:0;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
button{font:inherit;color:inherit}
.dots{display:flex;gap:6px;margin:10px 0 0}.dots i{flex:1;height:4px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--brand)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer}
.opt b{display:block;font-weight:700}.opt span{color:var(--muted);font-size:14px}
.opt.on{border-color:var(--brand);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--soft);font-weight:500}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin-top:8px}
.day{flex:0 0 auto;min-width:64px;text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 6px;cursor:pointer}
.day b{display:block;font-size:20px;line-height:1.1}.day span{font-size:13px;color:var(--muted)}
.day.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.day.on span{color:var(--brand-ink)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;cursor:pointer;font-size:15px}
.slot.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.slot:disabled{background:var(--taken);color:var(--muted);text-decoration:line-through;cursor:not-allowed;border-color:var(--taken)}
label{display:block;font-size:14px;font-weight:500;margin:14px 0 5px}
input[type=text],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:14px}
.check input{margin-top:3px;accent-color:var(--brand)}
.bar{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.ghost{flex:0 0 auto;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:500;padding:14px 18px}
.err{color:var(--warn);font-size:14px;margin-top:10px;min-height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--brand);font-weight:700}
.tag.new{background:var(--brand);color:var(--brand-ink)}
.mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini a,.mini button{font-size:14px;border:1.5px solid var(--line);background:none;border-radius:9px;padding:6px 11px;text-decoration:none;color:var(--ink);cursor:pointer}
.mini .on{background:var(--soft);border-color:var(--brand)}
.dh{font-weight:700;margin:20px 0 0;font-size:15px;color:var(--muted)}
.ok{color:var(--ok);font-weight:700}.late{color:var(--warn);font-weight:700}
.big{text-align:center;padding:26px 8px 6px}.big .ic{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:92%;z-index:5}
.step{display:flex;align-items:center;gap:12px}.step button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
input[type=text].pr{width:90px;display:inline-block;padding:7px 10px}
.mini a.wa{background:#1E8E5A;border-color:#1E8E5A;color:#fff;font-weight:500}
.cx{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.seg4 button{padding:8px 2px;font-size:13px}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:700;color:#fff;margin-left:6px;vertical-align:1px}.pill.hj{background:#C62828}.pill.am{background:#C25400}
.mini a.rm{border-color:#1E8E5A;color:var(--ok);font-weight:500}
.nt{margin-top:8px;font-size:14px;color:var(--ink);background:var(--soft);border-radius:10px;padding:8px 10px}
.cn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}.cn:disabled{opacity:.4;cursor:not-allowed}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cg i{font-style:normal;font-size:12px;color:var(--muted);text-align:center}
.cd{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:15px;cursor:pointer;padding:0}.cd.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.cd:disabled{background:transparent;border-color:transparent;color:var(--muted);opacity:.45;cursor:not-allowed}.mini button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>❄️ Agenda Técnica</h1>
    <div class="seg" role="tablist"><button data-act="role" data-v="cli" id="r-cli">Cliente</button><button data-act="role" data-v="tec" id="r-tec">Técnico</button></div>
  </div>
  <p style="font-size:13px">Protótipo: agende na visão do cliente e veja o horário aparecer na visão do técnico.</p>
  <main id="app"></main>
</div>
<div id="toast"></div>
<script>
var SERV={visita:["Visita técnica","Não sei qual é o problema"],hig:["Higienização","Limpeza completa do aparelho"],inst:["Instalação","Aparelho novo"],desi:["Desinstalação","Retirada do aparelho"],gas:["Recarga de gás","Aparelho não gela como antes"],ele:["Problema elétrico","Disjuntor, fiação, tomada"],outro:["Outro serviço","Descreva nas observações"]};
var SINT=["Não gela","Pinga água","Faz barulho","Cheiro ruim","Não liga","Desarma o disjuntor","Não sei dizer"];
var HORAS=["08:00","09:00","10:00","11:00","13:00","14:00","15:00","16:00"];
var WD=["dom","seg","ter","qua","qui","sex","sáb"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var DIAS=[];(function(){var d=new Date();while(DIAS.length<14){d.setDate(d.getDate()+1);DIAS.push({iso:iso(d),n:d.getDate(),w:WD[d.getDay()],dow:d.getDay(),full:WD[d.getDay()]+", "+d.getDate()+"/"+String(d.getMonth()+1).padStart(2,"0")})}})();
var CFG={sv:{visita:{on:1,p:80,u:0},hig:{on:1,p:150,u:1},inst:{on:1,p:400,u:1},desi:{on:1,p:150,u:1},gas:{on:1,p:250,u:1},ele:{on:1,p:100,u:0},outro:{on:0,p:0,u:0}},dw:[1,2,3,4,5,6],hs:HORAS.slice()};
function avail(){return DIAS.filter(function(d){return CFG.dw.indexOf(d.dow)>-1}).slice(0,6)}
function brl(n){return "R$ "+Number(n||0).toLocaleString("pt-BR")}
function dlabel(i){var p=i.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return WD[d.getDay()]+", "+d.getDate()+"/"+String(d.getMonth()+1).padStart(2,"0")}
var S={role:"cli",q:1,tel:"",cx:null,step:0,who:"",svc:"",sym:[],day:"",slot:"",addr:"",obs:"",emp:"",cnpj:"",cont:"",cons:true,err:"",tab:"agenda",sel:[],last:null,
bk:[{id:1,key:DIAS[0].iso+" 08:00",name:"Carlos Mendes",tel:"67999990001",svc:"Higienização",who:"Pessoal",addr:"Rua 14 de Julho, 1200, Centro, Campo Grande MS",obs:"Moro em apartamento, bloco B"},
{id:2,key:DIAS[0].iso+" 10:00",name:"Padaria Estrela",tel:"67999990002",ct:"Rita",svc:"Instalação",who:"Empresa",addr:"Av. Afonso Pena, 3400, Campo Grande MS",obs:"Falar com a Dona Rita. Abre às 6h."},
{id:3,key:DIAS[1].iso+" 09:00",name:"Fernanda Lima",tel:"67999990003",svc:"Recarga de gás",who:"Pessoal",addr:"Rua Pedro Celestino, 850, Campo Grande MS",obs:"Moro em casa"},{id:4,key:iso(new Date())+" 14:00",name:"Clínica Vida",tel:"67999990004",ct:"Marta",svc:"Higienização",who:"Empresa",addr:"Rua Rio Grande do Sul, 410, Campo Grande MS",obs:"Entrar pela recepção",q:3,val:450}],
cl:[{id:1,name:"Maria Souza",svc:"Higienização",ago:182,iv:180},{id:2,name:"Padaria Estrela",svc:"Manutenção preventiva",ago:78,iv:90},{id:3,name:"João Pereira",svc:"Recarga de gás",ago:200,iv:365}],nid:10};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function taken(k){return S.bk.some(function(b){return b.key===k})}
function toast(t){var e=document.getElementById("toast");e.innerHTML='<div class="toast">'+esc(t)+"</div>";setTimeout(function(){e.innerHTML=""},2800)}
function dots(){var h='<div class="dots">';for(var i=0;i<4;i++)h+='<i class="'+(i<=S.step?"on":"")+'"></i>';return h+"</div>"}
function bar(next,label,back){return '<div class="bar">'+(back?'<button class="btn ghost" data-act="back">Voltar</button>':"")+'<button class="btn" data-act="'+next+'">'+label+"</button></div>"}
function cli(){
 var h="";
 if(S.step===0){
  h=dots()+"<h2>Para quem é o serviço?</h2><p>Assim o técnico já sabe como atender.</p>"+
  '<button class="opt" data-act="who" data-v="Pessoal"><b>Pessoal</b><span>Minha casa ou apartamento</span></button>'+
  '<button class="opt" data-act="who" data-v="Empresa"><b>Empresa</b><span>Loja, escritório, consultório ou indústria</span></button>';
 }else if(S.step===1){
  h=dots()+"<h2>Qual serviço você precisa?</h2><p>Se não souber, escolha a visita técnica.</p>";
  for(var k in SERV){var c=CFG.sv[k];if(!c.on)continue;h+='<button class="opt'+(S.svc===k?" on":"")+'" data-act="svc" data-v="'+k+'"><div class="row"><b>'+SERV[k][0]+"</b><b>"+(c.p?brl(c.p)+(c.u?" /aparelho":""):"A combinar")+"</b></div><span>"+SERV[k][1]+"</span></button>"}
  if(S.svc&&CFG.sv[S.svc].u)h+='<div class="card row" style="align-items:center"><div><b>Quantos aparelhos?</b><p>Total: '+brl(CFG.sv[S.svc].p*S.q)+'</p></div><div class="step"><button data-act="qm" aria-label="Menos">−</button><b>'+S.q+'</b><button data-act="qp" aria-label="Mais">+</button></div></div>';
  if(S.svc==="visita"){h+='<h2 style="font-size:17px">O que está acontecendo?</h2><p>Marque o que notou. Pode escolher mais de um.</p><div class="chips">';
   SINT.forEach(function(s){h+='<button class="chip'+(S.sym.indexOf(s)>-1?" on":"")+'" data-act="sym" data-v="'+s+'">'+s+"</button>"});h+="</div>"}
  h+='<div class="err">'+S.err+"</div>"+bar("next","Continuar",1);
 }else if(S.step===2){
  h=dots()+"<h2>Escolha o dia e o horário</h2><p>Dias apagados não têm vaga. Horários riscados já foram reservados.</p>";
  h+=cal();
  if(S.day){h+='<p style="margin-top:14px"><b>'+dlabel(S.day)+'</b></p><div class="slots">';CFG.hs.forEach(function(t){var k=S.day+" "+t;h+='<button class="slot'+(S.slot===t?" on":"")+'" data-act="slot" data-v="'+t+'"'+(taken(k)?" disabled":"")+">"+t+"</button>"});h+="</div>"}
  h+='<div class="err">'+S.err+"</div>"+bar("next","Continuar",1);
 }else if(S.step===3){
  h=dots()+"<h2>Onde será o atendimento?</h2>";
  if(S.who==="Empresa")h+='<label>Nome da empresa</label><input type="text" data-f="emp" value="'+esc(S.emp)+'"><label>CNPJ</label><input type="text" data-f="cnpj" inputmode="numeric" value="'+esc(S.cnpj)+'"><label>Pessoa de contato</label><input type="text" data-f="cont" value="'+esc(S.cont)+'">';
  else h+='<label>Seu nome</label><input type="text" data-f="cont" value="'+esc(S.cont)+'">';
  h+='<label>WhatsApp com DDD</label><input type="text" data-f="tel" inputmode="tel" placeholder="(67) 99999-9999" value="'+esc(S.tel)+'"><label>Endereço completo</label><input type="text" data-f="addr" placeholder="Rua, número, bairro" value="'+esc(S.addr)+'"><label>Observações</label><div class="chips" style="margin:0 0 8px">';
  ["Moro em casa","Moro em apartamento","Tem portaria","Cuidado com o cachorro"].forEach(function(o){h+='<button class="chip" data-act="obs" data-v="'+o+'">+ '+o+"</button>"});
  h+='</div><textarea data-f="obs">'+esc(S.obs)+'</textarea><label class="check"><input type="checkbox" data-f="cons"'+(S.cons?" checked":"")+'><span>Aceito receber lembretes de manutenção. Posso cancelar quando quiser.</span></label><div class="err">'+S.err+"</div>"+bar("book","Confirmar agendamento",1);
 }else{
  var b=S.last;h='<div class="big"><div class="ic">✓</div><h2 style="margin-top:0">Agendado!</h2><p>'+dlabel(b.key.slice(0,10))+" às "+b.key.slice(11)+"</p></div>"+
  '<div class="card"><b>'+esc(b.svc)+(b.q?" · "+b.q+(b.q>1?" aparelhos":" aparelho"):"")+'</b><p>'+(b.val?"Valor estimado: "+brl(b.val):"Valor a combinar")+"</p><p>"+esc(b.addr)+"</p>"+(b.obs?"<p>"+esc(b.obs)+"</p>":"")+"</div>"+
  '<p style="margin-top:12px;text-align:center">Esse horário agora está bloqueado para outros clientes.</p><div class="bar"><button class="btn ghost" data-act="again">Novo agendamento</button><button class="btn" data-act="role" data-v="tec">Ver como técnico</button></div>';
 }
 return h;
}
function rota(ids){
 var a=S.bk.filter(function(b){return ids.indexOf(b.id)>-1}).sort(function(x,y){return x.key<y.key?-1:1}).map(function(b){return b.addr});
 if(!a.length)return"";
 var u="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(a[a.length-1]);
 if(a.length>1)u+="&waypoints="+encodeURIComponent(a.slice(0,-1).join("|"));return u;
}
function tec(){if(S.tab==="agendar")return mf();if(S.tab==="cfg")return cfg();
 var h=seg3();
 if(S.tab==="agenda"){
  var L=S.bk.slice().sort(function(a,b){return a.key<b.key?-1:1}),cur="";
  if(!L.length)h+='<div class="card"><b>Agenda livre</b><p>Quando um cliente agendar, aparece aqui.</p></div>';
  L.forEach(function(b){var d=b.key.slice(0,10);if(d!==cur){cur=d;h+='<div class="dh">'+dlabel(d)+bdg(d)+"</div>"}
   var on=S.sel.indexOf(b.id)>-1;
   h+='<div class="card"><div class="row"><div><b>'+b.key.slice(11)+" · "+esc(b.svc)+(b.q?" · "+b.q+"x":"")+"</b><p>"+esc(b.name)+(b.val?" · "+brl(b.val):"")+'</p></div><span class="tag'+(b.nw&&!b.ret?" new":"")+'">'+(b.ret?"Retorno":b.nw?"Novo":b.who)+"</span></div><p style=\"margin-top:6px\">"+esc(b.addr)+"</p>"+(b.obs?'<p style="margin-top:4px">“'+esc(b.obs)+'”</p>':"")+
   '<div class="mini"><a class="wa" href="'+wa(b)+'" target="_blank" rel="noopener">Conversar no WhatsApp</a><a class="rm" href="'+wr(b)+'" target="_blank" rel="noopener">Lembrar cliente</a><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b.addr)+'" target="_blank" rel="noopener">Abrir no Maps</a><button class="'+(on?"on":"")+'" data-act="sel" data-v="'+b.id+'">'+(on?"✓ Na rota":"Adicionar à rota")+'</button><button data-act="done" data-v="'+b.id+'">Concluir</button><button data-act="rt" data-v="'+b.id+'">Voltar depois</button><button data-act="cx" data-v="'+b.id+'">Cancelar visita</button><button data-act="nt" data-v="b'+b.id+'">'+(b.note?"Anotação ✓":"Anotações")+'</button></div>'+(b.hist?b.hist.map(function(t){return'<p class="nt">↩ '+esc(t)+"</p>"}).join(""):"")+notep("b"+b.id,b)+rtp(b)+cxp(b)+'</div>'});
  if(S.sel.length)h+='<div class="bar"><a class="btn" href="'+rota(S.sel)+'" target="_blank" rel="noopener">Criar rota com '+S.sel.length+(S.sel.length>1?" clientes":" cliente")+"</a></div>";
 }else{
  var R=S.bk.filter(function(b){return b.ret}).sort(function(x,y){return x.key<y.key?-1:1});
  if(R.length){h+='<div class="dh">Retornos marcados</div>';R.forEach(function(b){h+='<div class="card"><div class="row"><div><b>'+dlabel(b.key.slice(0,10))+" às "+b.key.slice(11)+"</b><p>"+esc(b.name)+" · "+esc(b.svc)+'</p></div><span class="tag">Retorno</span></div>'+(b.rn?'<p style="margin-top:6px">Motivo: '+esc(b.rn)+"</p>":"")+'<p style="margin-top:4px;font-size:13px">Você será lembrado na véspera.</p></div>'});h+='<div class="dh">Clientes para chamar de volta</div>'}
  h+='<p style="margin-top:12px">Clientes que já podem voltar. O app avisa você, e basta tocar para enviar.</p>';
  S.cl.slice().sort(function(a,b){return(a.iv-a.ago)-(b.iv-b.ago)}).forEach(function(c){var r=c.iv-c.ago;
   var msg="Olá, "+c.name.split(" ")[0]+"! Já faz um tempo desde o último serviço ("+c.svc.toLowerCase()+"). Quer agendar o próximo? Escolha o dia e horário aqui: (link do técnico)";
   h+='<div class="card"><div class="row"><div><b>'+esc(c.name)+"</b><p>"+esc(c.svc)+" · há "+c.ago+' dias</p></div><span class="'+(r<=0?"late":r<=15?"late":"ok")+'">'+(r<=0?"Vencido":"em "+r+" dias")+'</span></div><div class="mini"><a href="https://wa.me/?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">Lembrar pelo WhatsApp</a><button data-act="snooze" data-v="'+c.id+'">Adiar 30 dias</button><button data-act="nt" data-v="c'+c.id+'">'+(c.note?"Anotação ✓":"Anotações")+'</button></div>'+notep("c"+c.id,c)+'</div>'});
 }
 return h;
}
function wa(b){var n=(b.tel||"").replace(/\D/g,""),p=(b.ct||b.name).split(" ")[0],m="Olá, "+p+"! Aqui é o técnico, sobre o seu agendamento de "+b.svc.toLowerCase()+" em "+dlabel(b.key.slice(0,10))+" às "+b.key.slice(11)+". ";return "https://wa.me/"+(n.length<=11?"55"+n:n)+"?text="+encodeURIComponent(m)}
